services:
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.docker
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: securityscan
      POSTGRES_USER: securityscan
      POSTGRES_PASSWORD: securityscan
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./users.sql:/docker-entrypoint-initdb.d/01-users.sql:ro
      - ./scanning.sql:/docker-entrypoint-initdb.d/02-scanning.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securityscan"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: ./microservices
    env_file:
      - ./microservices/.env.docker
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
